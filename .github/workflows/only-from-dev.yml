name: only-from-dev

# ด่านตรวจ: PR ที่จะเข้า main ต้องมาจาก branch dev เท่านั้น
on:
  pull_request:
    branches:
      - main

jobs:
  only-from-dev:
    name: only-from-dev
    runs-on: ubuntu-latest
    steps:
      - name: ตรวจว่า PR นี้มาจาก branch dev หรือไม่
        run: |
          echo "PR นี้มาจาก branch : ${{ github.head_ref }}"
          echo "PR นี้จะเข้า branch : ${{ github.base_ref }}"
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::ไม่อนุญาต! merge เข้า main ได้จาก branch 'dev' เท่านั้น (ตอนนี้มาจาก '${{ github.head_ref }}')"
            echo "วิธีแก้: เอางานของคุณ merge เข้า dev ก่อน แล้วค่อยเปิด PR จาก dev เข้า main"
            exit 1
          fi
          echo "ผ่าน: PR นี้มาจาก dev ถูกต้อง"
